

name: Build Shiroko Voice Mini

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Repair Android project structure
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/shiroko/voicemin
          mkdir -p app/src/main/res/values
          cp MainActivity.java app/src/main/java/com/shiroko/voicemin/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp styles.xml app/src/main/res/values/styles.xml
          cp build.gradle app/build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShirokoVoiceMini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
